<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONOR — Le jeu musical</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f8efff;background:#10091e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#42216c 0,transparent 45%),radial-gradient(ellipse at 90% 85%,#342044 0,transparent 45%),#10091e}main{max-width:1050px;margin:auto;padding:35px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.logo{font-weight:900;letter-spacing:.24em;color:#e7bf67;font-size:27px}.tag{font-size:12px;letter-spacing:.2em;color:#c8b4da}.panel{background:#21152fdc;border:1px solid #8d6eaa70;border-radius:23px;padding:27px;box-shadow:0 18px 55px #0004}.hero{text-align:center;max-width:660px;margin:65px auto 35px}.hero h1{font-size:clamp(38px,7vw,68px);margin:8px 0;background:linear-gradient(120deg,#fff,#e8c36d);background-clip:text;color:transparent}.muted{color:#bcaacb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,textarea{width:100%;background:#110b1c;color:#fff;border:1px solid #68507f;border-radius:12px;padding:15px;font:inherit;margin:9px 0}textarea{min-height:100px}button{background:linear-gradient(135deg,#e8c575,#b8893c);color:#24132b;border:0;border-radius:12px;padding:14px 21px;font-weight:800;cursor:pointer}button.secondary{background:#41265b;color:#fff;border:1px solid #8060a2}button:disabled{opacity:.4;cursor:not-allowed}h2{color:#f3d28d;margin-top:0}h3{margin:10px 0}.pill{display:inline-block;border:1px solid #a98b59;border-radius:30px;padding:9px 15px;color:#e8c575}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.timer{font-size:42px;font-weight:900;color:#f4d38a}.players{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.player{background:#372248;border-radius:12px;padding:10px 14px}.track{padding:15px;margin:12px 0;border:1px solid #6c5483;border-radius:14px;background:#160e22}.track iframe{width:100%;max-width:530px;aspect-ratio:16/9;border:0;border-radius:12px;display:block;margin:10px auto}.hidden{display:none!important}.message{min-height:26px;color:#ffcb91;margin-top:12px}.center{text-align:center}.score{font-weight:800;color:#f5d38b}small{color:#bba6c8}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:18px}.hero{margin:25px auto}header{margin-bottom:20px}}

body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#f2c978 1px,transparent 1px);background-size:53px 53px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}.panel{backdrop-filter:blur(18px);border-color:#a77aab55}.logo{text-shadow:0 0 28px #d4a55770}.track{border-color:#ad8a5360;background:linear-gradient(140deg,#321a48,#190e28)}.listening-stage{padding:20px;border:1px solid #b28b52;border-radius:20px;background:radial-gradient(circle at top,#492b68,#180e27 70%);text-align:center;box-shadow:0 0 50px #d6a44a12}.music-disc{font-size:48px;margin:10px auto;animation:spin 7s linear infinite;filter:drop-shadow(0 0 16px #d8ac59)}@keyframes spin{to{transform:rotate(360deg)}}.progress{height:7px;background:#4a365a;border-radius:9px;overflow:hidden;margin:16px 0}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#8d54df,#f4d184);transition:width .25s linear}.now{font-size:24px;color:#f5d38b;font-weight:900}.note{color:#cbb8d6;font-size:13px}.listening-stage iframe{display:block;width:100%;max-width:570px;aspect-ratio:16/9;margin:15px auto;border:0;border-radius:12px}.stepchips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.stepchips span{padding:7px 11px;border-radius:30px;background:#3b2751;color:#cbb6d8}.stepchips span.active{background:#d6af63;color:#21132d;font-weight:800}
</style></head><body><main><header><div class="logo">✦ SONOR</div><div class="tag">LA MUSIQUE FAIT LA SCÈNE</div></header><section id="entry"><div class="hero"><div class="pill">✧ LE JEU MUSICAL ENTRE AMIS ✧</div><h1>Une situation.<br>Une chanson.</h1><p class="muted">Imagine la scène, trouve la bande-son parfaite et remporte les votes.</p></div><div class="grid"><div class="panel"><h2>Créer une partie</h2><p class="muted">Invite tes amis grâce à un code privé.</p><input id="createName" placeholder="Ton pseudo" maxlength="22"><button onclick="send('create',{name:document.getElementById('createName').value})">Créer un salon ✦</button></div><div class="panel"><h2>Rejoindre une partie</h2><input id="joinName" placeholder="Ton pseudo" maxlength="22"><input id="joinCode" placeholder="Code du salon" maxlength="6" style="text-transform:uppercase"><button onclick="send('join',{name:document.getElementById('joinName').value,code:document.getElementById('joinCode').value})">Rejoindre →</button></div></div></section><section id="game" class="hidden"><div class="panel"><div class="top"><div><small>SALON PRIVÉ</small><h2 id="roomCode" style="margin:5px 0"></h2></div><div class="row"><span id="round" class="pill"></span><button class="secondary" onclick="navigator.clipboard.writeText(document.getElementById('roomCode').textContent)">Copier le code</button></div></div><div id="players" class="players"></div></div><div class="panel" style="margin-top:20px"><div class="top"><h2 id="phaseTitle">En attente</h2><div id="timer" class="timer"></div></div><div id="content"></div></div></section><div id="message" class="message center" role="status"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let me=null,state=null,submitted=false,voted=false,playingIndex=-1;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function msg(t){$('message').textContent=t||'';}function send(event,payload){socket.emit(event,payload,res=>{if(res?.error)msg(res.error);else{msg('');if(res?.id)me=res.id;}});}socket.on('state',s=>{const old=state;state=s;if(!old||old.round!==s.round){submitted=false;voted=false;}render();});socket.on('disconnect',()=>msg('Connexion perdue. Recharge la page pour rejoindre un salon.'));
function render(){const s=state;if(!s)return;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=s.code;$('round').textContent='MANCHE '+s.round;$('players').innerHTML=s.players.map(p=>`<div class="player">${esc(p.name)} ${p.id===s.leader?'👑':''} <span class="score">${p.score} pt</span></div>`).join('');const leader=me===s.leader;const titles={lobby:'Le salon est prêt',prompt:'Imagine une situation',submit:'Trouve la bande-son parfaite',listen:'Place à l’écoute',vote:'Vote pour la meilleure musique',results:'Résultats de la manche'};$('phaseTitle').textContent=titles[s.phase];let html='';if(s.phase==='lobby')html=`<p class="muted">Partage le code avec tes amis. Minimum 2 joueurs.</p><button onclick="send('start',{})">Lancer la partie</button><p><small>Seul le créateur du salon peut lancer.</small></p>`;
if(s.phase==='prompt')html=leader?`<p>Tu es le chef ! Écris une situation drôle, épique ou dramatique.</p><textarea id="situation" maxlength="220" placeholder="Ex. : Tu découvres que ton meilleur ami est le méchant de l'histoire..."></textarea><button onclick="send('prompt',$('situation').value)">Valider la situation</button>`:`<p class="muted">Le chef prépare sa situation…</p>`;
if(s.phase==='submit')html=`<h3>« ${esc(s.situation)} »</h3><p class="muted">${s.submitted} / ${s.total} musiques proposées</p>`+(leader?'<p>Tu es le chef : attends les propositions.</p>':submitted?'<p>✓ Ton lien a été envoyé.</p>':`<input id="youtube" placeholder="https://www.youtube.com/watch?v=..."><button onclick="submitSong()">Envoyer ma chanson</button>`);
if(s.phase==='listen')html=`<h3>« ${esc(s.situation)} »</h3><div class="listening-stage"><div class="music-disc">♫</div><div class="now" id="nowTrack">Préparation des extraits…</div><p class="note">Lecture automatique, un extrait à la fois, à un passage aléatoire. Certains navigateurs exigent un clic pour activer le son.</p><div class="progress"><div id="songProgress"></div></div><div id="playerSlot"></div><button class="secondary" onclick="retryPlayback()">▶ Activer le son / relancer l'extrait</button><div class="stepchips">${s.tracks.map(t=>`<span id="chip${t.index}">♪ ${t.index+1}</span>`).join('')}</div></div>`;
if(s.phase==='vote')html=`<h3>« ${esc(s.situation)} »</h3><p class="muted">Choisis ton morceau favori. Les auteurs restent anonymes jusqu'aux résultats.</p>`+(voted?'<p>✓ Vote enregistré.</p>':s.tracks.map(t=>`<div class="track"><b>Musique ${t.index+1}</b><div class="row"><button onclick="castVote(${t.index})">Voter pour cette musique</button><a style="color:#e8c575" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${t.videoId}">Écouter sur YouTube</a></div></div>`).join(''));
if(s.phase==='results')html=`<h3>${s.winner?'🏆 '+esc(s.winner.name)+' gagne la manche !':'Aucun gagnant cette manche'}</h3><p class="muted">${s.winner?'Avec '+s.winner.votes+' vote(s). Le gagnant devient chef de la prochaine manche.':''}</p>`+s.results.map(x=>`<div class="track">Musique ${x.index+1} — <b>${esc(x.name)}</b> : ${x.votes} vote(s)</div>`).join('')+`<button onclick="send('next',{})">Manche suivante →</button><p><small>Seul l'hôte peut passer à la manche suivante.</small></p>`;
$('content').innerHTML=html;playingIndex=-1;updateTimer();updatePlayback();}function submitSong(){const url=$('youtube').value;socket.emit('submit',url,res=>{if(res?.error)msg(res.error);else{submitted=true;msg('');render();}});}function castVote(index){socket.emit('vote',index,res=>{if(res?.error)msg(res.error);else{voted=true;msg('');render();}});}function retryPlayback(){playingIndex=-1;updatePlayback(true)}
function updatePlayback(force=false){if(!state||state.phase!=='listen')return;const s=state;const n=s.tracks.length;if(!n)return;const duration=s.clipSeconds||15;const elapsed=Math.max(0,(Date.now()-(s.listenStarted||Date.now()))/1000);const index=Math.min(n-1,Math.floor(elapsed/duration));const progress=Math.min(100,Math.max(0,(elapsed-index*duration)/duration*100));if($('songProgress'))$('songProgress').style.width=progress+'%';if(index===playingIndex&&!force)return;playingIndex=index;const t=s.tracks[index];if(!t)return;const title=$('nowTrack');if(title)title.textContent='EXTRAIT '+(index+1)+' / '+n;for(let i=0;i<n;i++)$('chip'+i)?.classList.toggle('active',i===index);const start=t.start||30;const slot=$('playerSlot');if(slot)slot.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${t.videoId}?autoplay=1&start=${start}&end=${start+duration}&playsinline=1&rel=0&enablejsapi=1" title="Musique ${index+1}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;}
function updateTimer(){if(!state)return;const left=state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):null;$('timer').textContent=left===null?'':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;}setInterval(()=>{updateTimer();updatePlayback()},250);
</script></body></html>
